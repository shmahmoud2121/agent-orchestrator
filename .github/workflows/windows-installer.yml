# .github/workflows/windows-installer.yml
name: Windows installer

# Press "Run workflow" on the Actions tab to build the Altair Setup .exe from a
# branch. The installer is attached to the run as a downloadable artifact.
# Unsigned (Windows SmartScreen will warn), no secrets beyond the run's own token.
#
# Each build is stamped <major>.<minor>.<run number> so a newer build always
# compares as newer. With "publish" ticked (the default) the build is also
# published as a GitHub release with the electron-updater feed (latest.yml +
# blockmap), which is what Settings -> Updates -> Check for updates reads.
# Untick it for a test build you do not want offered as an update.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        type: string
        required: true
        default: main
      publish:
        description: "Publish as a release so installed apps can update to it"
        type: boolean
        default: true

permissions:
  # write: create the release when publish is ticked.
  contents: write

concurrency:
  group: windows-installer-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      # build-daemon.mjs compiles the Go daemon during premake.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui
      - name: Stamp version
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(node -e "const p=require('./package.json'); const [a,b]=p.version.split('.'); process.stdout.write(a+'.'+b+'.'+process.env.RUN_NUMBER)")"
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.argv[1]; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n')" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Build installer (unsigned)
        shell: bash
        env:
          AO_RELEASE_REPO: ${{ github.repository }}
        run: npm run make
      - name: Collect installer
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p dist-installer
          # NSIS output: out/make/<productName> Setup <version>.exe
          src="$(find out/make -maxdepth 1 -name '*Setup*.exe' | head -n1)"
          if [ -z "$src" ]; then echo "no .exe output found" >&2; exit 1; fi
          cp "$src" "dist-installer/Altair-Setup.exe"
          hash="$(sha256sum dist-installer/Altair-Setup.exe | awk '{print $1}')"
          echo "$hash  Altair-Setup.exe" > dist-installer/Altair-Setup.exe.sha256
          echo "Built \`$BUILD_REF\` at $(git rev-parse --short HEAD). sha256: $hash" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Altair-Setup-${{ github.run_number }}
          path: frontend/dist-installer/
          retention-days: 14
          if-no-files-found: error
      # The feed names the versioned installer, so electron-updater on an
      # installed app finds latest.yml on the newest release, compares the
      # version, and downloads Altair-Setup-<version>.exe (+ its blockmap).
      - name: Publish release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp dist-installer/Altair-Setup.exe "dist-release/Altair-Setup-$VERSION.exe"
          # Called through import(): feed.mjs's CLI guard compares a file:// URL
          # to argv[1], which never matches a Windows path.
          node --input-type=module -e "const m = await import('./scripts/feed.mjs'); await m.generateFeeds('dist-release', process.argv[1], 'latest', new Date().toISOString());" "$VERSION"
          test -f dist-release/latest.yml
          cat dist-release/latest.yml
          gh release create "v$VERSION" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Altair $VERSION" \
            --notes "Windows build of \`$BUILD_REF\` at $(git rev-parse --short HEAD)." \
            --latest
          echo "Published release v$VERSION" >> "$GITHUB_STEP_SUMMARY"
